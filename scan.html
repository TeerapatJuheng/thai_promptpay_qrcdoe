<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan QR Code</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            text-align: center;
            padding: 20px;
        }
        header, footer {
            background-color: #007bff;
            color: white;
            padding: 10px 0;
        }
        footer {
            position: fixed;
            width: 100%;
            bottom: 0;
            left: 0;
        }
        #imgqr {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 20px auto;
        }
        .img{
            height: 100px;
        }
    </style>
</head>
<body>
    <header>
        <h1>QR Code Scan</h1>
    </header>

    <div class="container">
        <h2>Your QR Code</h2>
        <img class="img" src="./assets/pay.png" alt="QR Code">
        <img id="imgqr" src="" alt="QR Code">
    </div>

    <footer>
        <p>&copy; 2024 Your Company. All rights reserved.</p>
    </footer>

    <script>
        // Function to get query parameters from URL
        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        // On page load, set QR code image source
        window.onload = function() {
            const qrCode = getQueryParam('qr');
            if (qrCode) {
                document.getElementById('imgqr').src = qrCode;
            } else {
                console.log('No QR code data found.');
            }
        }
    </script>
</body>
</html>
