<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Generate QR Code</title>
    <style>
        :root {
            --pink:var(#e84393)
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            outline: none;
            border: none;
            text-decoration: none;
            text-transform: capitalize;
            transition: .2s linear;
        }
        html {
            font-size: 62.5%;
            scroll-behavior: smooth;
            scroll-padding-top: 6rem;
            overflow-x: hidden;
        }
        header{
            position: fixed;
            top: 0; left: 0; right: 0;
            background: #fff;
            padding: 2rem 9%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            /* z-index: 1; */
            box-shadow: 0 .5rem 1rem rgba(0, 0, 0, .1);
        }
        header {
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            z-index: 1000;
        }
        footer {
            position: fixed;
            width: 100%;
            bottom: 0;
            left: 0;
        }
        header nav {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        header nav a {
            color: var(--pink);
            text-decoration: none;
            font-weight: bold;
        }
        header nav a:hover {
            text-decoration: underline;
        }
        .container {
            margin-top: 60px; /* Adjust based on header height */
            margin-bottom: 40px; /* Adjust based on footer height */
            padding: 20px;
        }
        .product-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .product {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 15px;
            text-align: center;
            width: 250px;
            transition: transform 0.2s;
        }
        .product:hover {
            transform: scale(1.05);
        }
        .product img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }
        .product p {
            font-size: 16px;
            color: #555;
            margin: 10px 0;
        }
        .product button {
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-size: 16px;
            padding: 10px 15px;
            transition: background-color 0.3s;
        }
        .product button:hover {
            background-color: #0056b3;
        }
        .generate-section {
            text-align: center;
            margin: 20px 0;
        }
        .generate-section input {
            padding: 10px;
            font-size: 16px;
            margin-right: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .generate-section button {
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-size: 16px;
            padding: 10px 15px;
            transition: background-color 0.3s;
        }
        .generate-section button:hover {
            background-color: #0056b3;
        }
        #imgqr {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <header>
        <a href="#"><img src="./assets/logo.png" alt="Logo"></a>
        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
        <dir>
            <a href="#" class="fas fa-heart"></a>
            <a href="#" class="fas fa-shopping-cart"></a>
            <a href="#" class="fas fa-user"></a>
        </dir>
    </header>

    <div class="container">
        

        <h2>Products</h2>
        <div class="product-list">
            <div class="product">
                <img src="./assets/aes.png" alt="Product 1">
                <p>Arsenal Third Shirt</p>
                <p>3400 บาท</p>
                <button onclick="generateAndRedirect(1.00)">Buy</button>
            </div>
            <div class="product">
                <img src="./assets/ar.png" alt="Product 2">
                <p>Arsenal Away Shirt</p>
                <p>3400 บาท</p>
                <button onclick="generateAndRedirect(1.00)">Buy</button>
            </div>
            <div class="product">
                <img src="./assets/city.png" alt="Product 3">
                <p>City Home Shirt</p>
                <p>3000 บาท</p>
                <button onclick="generateAndRedirect(1.00)">Buy</button>
            </div>
            <div class="product">
                <img src="./assets/les.png" alt="Product 4">
                <p>Leicester Home Shirt</p>
                <p>2000 บาท</p>
                <button onclick="generateAndRedirect(1.00)">Buy</button>
            </div>
            <div class="product">
                <img src="./assets/manu.png" alt="Product 5">
                <p>Manchester United F.C.</p>
                <p>3200 บาท</p>
                <button onclick="generateAndRedirect(1.00)">Buy</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 Your Company. All rights reserved.</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.js" integrity="sha256-H+K7U5CnXl1h5ywQfKtSj8PCmoN9aaq30gDh27Xc0jk=" crossorigin="anonymous"></script>
    <script>
        function genQR() {
            $.ajax({
                method: 'POST',
                url: 'http://localhost:3000/generateQR',
                data: JSON.stringify({ amount: parseFloat($("#amount").val()) }),
                contentType: 'application/json',
                success: function(response) {
                    console.log('Success:', response);
                    $("#imgqr").attr('src', response.Result);
                },
                error: function(err) {
                    console.log('Error:', err);
                }
            });
        }

        function generateAndRedirect(amount) {
            $.ajax({
                method: 'POST',
                url: 'http://localhost:3000/generateQR',
                data: JSON.stringify({ amount: amount }),
                contentType: 'application/json',
                success: function(response) {
                    console.log('Success:', response);
                    // Redirect to scan page with QR code data
                    window.location.href = `scan.html?qr=${encodeURIComponent(response.Result)}`;
                },
                error: function(err) {
                    console.log('Error:', err);
                }
            });
        }
    </script>
</body>
</html>
